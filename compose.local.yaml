# Standalone database for a JVM running on the host. It has its own volume.
name: chatty-x-local
services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: chattyx
      POSTGRES_USER: chattyx
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run node infra/init-env.mjs --demo first}
    ports:
      - 127.0.0.1:55432:5432
    volumes:
      - local-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U chattyx -d chattyx]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  local-postgres:
