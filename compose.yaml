name: chatty-x
include:
  - compose.e2e.yaml
services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: chattyx
      POSTGRES_USER: chattyx
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run node infra/init-env.mjs}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U chattyx -d chattyx]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build:
      context: backend
      target: ${BACKEND_TARGET:-production}
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/chattyx
      DATABASE_USER: chattyx
      DATABASE_PASSWORD: ${DB_PASSWORD}
      MASTER_KEY: ${MASTER_KEY:?Run node infra/init-env.mjs}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:?Run node infra/init-env.mjs}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CHATTY_MODE: ${CHATTY_MODE:-production}
      OLLAMA_CHAT_URL: ${OLLAMA_CHAT_URL:-http://host.docker.internal:11434/api/chat}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-0}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
    volumes:
      - application:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s
  web:
    build: frontend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      BACKEND_UPSTREAM: backend:8080
    ports:
      - ${HTTP_BIND:-127.0.0.1:8088}:80
      - ${HTTPS_BIND:-127.0.0.1:8443}:443
    volumes:
      - caddy:/data
    depends_on:
      - backend
    restart: unless-stopped
  backend-check:
    profiles: [test]
    image: maven:3.9.11-eclipse-temurin-25
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
      - maven-cache:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      DOCKER_API_VERSION: "1.44"
    command: mvn -B verify
  frontend-check:
    profiles: [test]
    image: node:22.23.1-bookworm-slim
    working_dir: /workspace
    volumes:
      - ./frontend:/workspace
      - frontend-deps:/workspace/node_modules
    command: sh -c "npm ci && npm run lint && npm run typecheck && npm test && npm run build"
volumes:
  postgres:
  application:
  caddy:
  maven-cache:
  frontend-deps:
